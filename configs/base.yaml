# Single source of truth for all hyperparameters; every run saves its resolved copy next to its results.
# LOCKED = fixed by design, identical for all compared models. RULE = value picked by a fixed selection
# rule (LR sweep, profiling, early stopping); the chosen value is written here.

paths:
  results: results
  results_smoke: results_smoke

data:
  hf_name: Salesforce/wikitext          # LOCKED
  hf_config: wikitext-2-v1              # LOCKED
  lowercase: true
  specials: ["<pad>", "<unk>", "<eos>"] # <pad> must be id 0
  context_length: 128                   # LOCKED
  smoke_fraction: 0.01                  # first 1% of each split's token stream in --smoke

ngram:
  order: 3
  lambda_grid_step: 0.05                # RULE: grid search on validation

model:                                  # LOCKED architecture
  emb_dim: 100
  hidden: 256
  layers: 2
  dropout: 0.3
  emb_init_std: 0.1
  transformer:
    nhead: 4
    dim_feedforward: 1024

embedding:                              # Part I default; Part II overrides only these keys
  type: random                          # random | own_frozen | glove_frozen
  freeze: false

train:
  batch_size: 32                        # LOCKED effective batch size
  micro_batch: 32                       # RULE: fits in 4 GB (profiled)
  weight_decay: 0.01                    # LOCKED
  grad_clip: 1.0                        # LOCKED
  warmup_steps: 200                     # LOCKED (Transformer only)
  max_epochs: 40                        # RULE: 40 (fits the 8 h GPU budget)
  patience: 3                           # RULE
  wall_clock_cap_min: 90                # RULE
  amp: true                             # LOCKED (active on CUDA)
  seeds: [0, 1, 2]                      # LOCKED
  lr:                                   # RULE: filled in from the LR sweep (scripts/lr_sweep.py)
    rnn: null
    lstm: null
    transformer: null

budget:                                 # GPU-time budget check after the seed-0 runs
  total_gpu_hours: 8.0
  assumed_typical_epochs: 15            # assumption until seed-0 runs give real epochs-to-best

lr_sweep:
  grid: [3.0e-4, 1.0e-3, 3.0e-3]
  edge_low: 1.0e-4
  edge_high: 1.0e-2
  epochs: 2
  seed: 0

word2vec:                               # LOCKED
  vector_size: 100
  window: 5
  min_count: 1
  negative: 10
  epochs: 10
  seed: 0
  workers: 1
  sg: 1

glove:
  gensim_name: glove-wiki-gigaword-100
  missing_seed: 0                       # seed for N(0, sigma^2) rows of missing words

generation:                             # LOCKED
  max_new_tokens: 50
  temperature: 0.8
  top_k: 40
  sample_seed: 1234
  prompts:
    - "the history of the city began in the"
    - "in 1995 , the band released their second album"
    - "the species is found in the forests of"
    - "during the second world war , the ship was"
    - "the game received positive reviews from critics , who"

benchmark:
  batch_size: 32
  warmup_batches: 5
  throughput_runs: 3
  latency_runs: 5
  latency_new_tokens: 50

part3:
  hf_name: fancyzhx/ag_news             # LOCKED
  n_sample: 10000
  n_train: 8000
  n_val: 2000
  split_seed: 0
  max_len: 128
  C_grid: [0.01, 0.1, 1.0, 10.0]
  max_iter: 2000
  n_error_examples: 10
